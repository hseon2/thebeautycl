<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공지사항 | 화곡 더아름다운한의원</title>
    <meta name="description" content="화곡 더아름다운한의원 공지사항입니다." />
    <link rel="icon" href="logo_512x512_transparent.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      :root {
        --bg: #ffffff;
        --bg-alt: #f3ecf7;
        --bg-gray: #f6f1f8;
        --surface: #ffffff;
        --ink: #241b2e;
        --ink-soft: #6e6274;
        --border: #e3daea;

        --accent: #4a2168;
        --accent-strong: #2e1440;
        --accent-soft: #eadff0;
        --orchid: #9b5fa8;
        --gold: #a8763a;
        --on-accent: #fbf3e4;

        --shadow-soft: 0 18px 40px -24px rgba(46, 20, 64, 0.35);
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
      }
      h1,
      h2,
      h3 {
        font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        margin: 0;
        text-wrap: balance;
        color: inherit;
      }
      p {
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      img,
      svg {
        display: block;
        max-width: 100%;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
        border-radius: 4px;
      }

      .section-inner {
        max-width: 1160px;
        margin: 0 auto;
        padding-inline: clamp(20px, 5vw, 48px);
      }
      .eyebrow {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 0 0 14px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 13px 26px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.95rem;
        white-space: nowrap;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition:
          transform 0.15s ease,
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease;
      }
      .btn-ghost {
        border: 1px solid var(--border);
        background: none;
        color: var(--ink);
        padding: 9px 20px;
        font-size: 0.85rem;
      }
      .btn-ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-solid {
        background: var(--accent);
        color: var(--on-accent);
        border: none;
      }
      .btn-solid:hover {
        background: var(--accent-strong);
      }
      .btn-solid:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .header-inner {
        max-width: 1160px;
        margin: 0 auto;
        padding: 14px clamp(20px, 5vw, 48px);
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 1px;
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--ink);
      }
      .wordmark img {
        width: 38px;
        height: 38px;
        object-fit: contain;
      }
      .header-cta {
        margin-left: auto;
        flex-shrink: 0;
        border: none !important;
        background: var(--accent) !important;
        color: var(--on-accent) !important;
        padding: 10px 20px !important;
      }
      .header-cta:hover {
        background: var(--accent-strong) !important;
      }
      .header-cta svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      @media (max-width: 480px) {
        .header-cta {
          display: none;
        }
      }

      .page-head {
        padding-block: clamp(48px, 7vw, 80px) clamp(32px, 5vw, 56px);
      }
      .page-head a.back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--ink-soft);
        margin-bottom: 20px;
      }
      .page-head a.back:hover {
        color: var(--accent);
      }
      .page-head h1 {
        font-size: clamp(1.8rem, 3.4vw, 2.5rem);
        font-weight: 700;
        margin-bottom: 14px;
      }
      .page-head p {
        color: var(--ink-soft);
        max-width: 38em;
        font-size: 1rem;
      }

      .notice-body {
        padding-bottom: clamp(64px, 9vw, 108px);
      }

      /* list */
      .notice-add-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 20px;
      }
      .notice-full-list {
        border-top: 1px solid var(--border);
      }
      .notice-row-item {
        border-bottom: 1px solid var(--border);
      }
      .notice-row-main {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 4px;
      }
      .notice-row-link {
        display: flex;
        align-items: center;
        gap: 16px;
        flex: 1;
        min-width: 0;
      }
      .notice-row-link:hover .notice-text {
        color: var(--accent);
      }
      .notice-row-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .notice-tag {
        flex-shrink: 0;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 4px 10px;
        border-radius: 999px;
      }
      .notice-text {
        flex: 1;
        min-width: 0;
        font-size: 0.95rem;
        color: var(--ink);
        line-height: 1.6;
        transition: color 0.15s ease;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .notice-date {
        flex-shrink: 0;
        font-size: 0.78rem;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .notice-empty {
        padding: 40px 4px;
        color: var(--ink-soft);
        font-size: 0.92rem;
      }
      .admin-row-btn {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-soft);
        border: none;
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .admin-row-btn:hover {
        background: var(--accent);
        color: var(--on-accent);
      }

      /* detail */
      .notice-detail-tag {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 5px 12px;
        border-radius: 999px;
        margin-bottom: 16px;
      }
      .notice-detail-title {
        font-size: clamp(1.4rem, 2.6vw, 1.8rem);
        font-weight: 700;
        margin-bottom: 12px;
      }
      .notice-detail-meta {
        font-size: 0.82rem;
        color: var(--ink-soft);
        margin-bottom: 28px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--border);
      }
      .notice-detail-content {
        font-size: 1rem;
        line-height: 1.85;
        color: var(--ink);
        max-width: 42em;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 24px;
      }
      .notice-detail-content p {
        margin: 0 0 1em;
      }
      .notice-detail-content img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 12px 0;
      }
      .notice-detail-content table {
        border-collapse: collapse;
        width: 100%;
        margin: 16px 0;
      }
      .notice-detail-content td,
      .notice-detail-content th {
        border: 1px solid var(--border);
        padding: 8px 10px;
      }
      .notice-detail-actions {
        display: flex;
        gap: 8px;
      }

      /* composer */
      #notice-composer {
        display: flex;
        justify-content: center;
      }
      .composer-card {
        width: 100%;
        max-width: 760px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: clamp(24px, 4vw, 44px);
        box-shadow: var(--shadow-soft);
      }
      .composer-heading {
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 20px;
      }
      .composer-field {
        margin-bottom: 18px;
      }
      .composer-title-input {
        width: 100%;
        font-family: inherit;
        font-size: 1.3rem;
        font-weight: 700;
        padding: 10px 2px;
        border: none;
        border-bottom: 2px solid var(--border);
        color: var(--ink);
        background: none;
      }
      .composer-title-input:focus {
        outline: none;
        border-bottom-color: var(--accent);
      }
      .composer-meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }
      .composer-field label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--ink-soft);
        margin-bottom: 7px;
      }
      .composer-tag-field input {
        font-family: inherit;
        font-size: 0.9rem;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 180px;
        background: var(--bg);
        color: var(--ink);
      }
      .composer-author-static {
        font-size: 0.9rem;
        color: var(--ink);
        padding: 8px 0;
      }
      .composer-editor-field .tox-tinymce {
        border-radius: 10px !important;
        border-color: var(--border) !important;
      }
      .composer-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
      }

      footer {
        border-top: 1px solid var(--border);
        padding-block: 32px;
      }
      .footer-inner {
        max-width: 1160px;
        margin: 0 auto;
        padding-inline: clamp(20px, 5vw, 48px);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 0.82rem;
        color: var(--ink-soft);
        line-height: 1.8;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin-mode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js"></script>
    <script>
      (function () {
        if (!window.supabaseClient) {
          document.getElementById("notice-full-list").innerHTML =
            '<p style="color:var(--ink-soft)">공지사항을 불러올 수 없습니다.</p>';
          return;
        }
        var sb = window.supabaseClient;
        var params = new URLSearchParams(location.search);
        var noticeId = params.get("id");
        var wantsNew = params.get("new") === "1";

        var listView = document.getElementById("notice-list-view");
        var detailView = document.getElementById("notice-detail-view");
        var fullList = document.getElementById("notice-full-list");
        var addSlot = document.getElementById("notice-add-slot");
        var composer = document.getElementById("notice-composer");
        var backLink = document.getElementById("back-link");
        var pageSub = document.getElementById("page-sub");

        var TAG_OPTIONS = ["필독", "휴진", "안내", "이벤트"];

        var TINYMCE_CONF = {
          height: 380,
          menubar: false,
          license_key: "gpl",
          branding: false,
          plugins: "lists link image table code",
          toolbar:
            "undo redo | blocks fontfamily fontsizeinput | bold italic underline forecolor backcolor | alignleft aligncenter alignright | bullist numlist | link image table | removeformat code",
          content_style:
            "body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.75;color:#241b2e;}",
          images_upload_handler: function (blobInfo) {
            return new Promise(function (resolve, reject) {
              var file = blobInfo.blob();
              var safeName = blobInfo
                .filename()
                .replace(/[^a-zA-Z0-9._-]/g, "_");
              var path = Date.now() + "_" + safeName;
              sb.storage
                .from("notice-images")
                .upload(path, file)
                .then(function (res) {
                  if (res.error) {
                    reject(res.error.message);
                    return;
                  }
                  var urlRes = sb.storage
                    .from("notice-images")
                    .getPublicUrl(path);
                  resolve(urlRes.data.publicUrl);
                });
            });
          },
        };

        function formatDate(iso) {
          return new Date(iso).toLocaleDateString("ko-KR");
        }

        function destroyEditor() {
          var ed = tinymce.get("composer-editor");
          if (ed) ed.remove();
        }

        // ---------- composer (write / edit screen) ----------
        function openComposer(mode, data) {
          listView.hidden = true;
          detailView.hidden = true;
          if (addSlot) addSlot.hidden = true;
          composer.hidden = false;

          var tagOptionsHtml = TAG_OPTIONS.map(function (t) {
            return '<option value="' + t + '"></option>';
          }).join("");

          composer.innerHTML =
            '<div class="composer-card">' +
            '<p class="composer-heading">' +
            (mode === "edit" ? "공지사항 수정" : "새 공지사항 작성") +
            "</p>" +
            '<div class="composer-field">' +
            '<input type="text" id="composer-title" class="composer-title-input" placeholder="제목을 입력하세요" />' +
            "</div>" +
            '<div class="composer-meta-row">' +
            '<div class="composer-field composer-tag-field">' +
            "<label>태그</label>" +
            '<input type="text" id="composer-tag" list="composer-tag-options" placeholder="태그 선택 또는 입력" />' +
            '<datalist id="composer-tag-options">' +
            tagOptionsHtml +
            "</datalist>" +
            "</div>" +
            '<div class="composer-field">' +
            "<label>작성자</label>" +
            '<div class="composer-author-static">관리자</div>' +
            "</div>" +
            "</div>" +
            '<div class="composer-field composer-editor-field">' +
            '<textarea id="composer-editor"></textarea>' +
            "</div>" +
            '<div class="composer-actions">' +
            '<button type="button" class="btn btn-ghost" id="composer-cancel">취소</button>' +
            '<button type="button" class="btn btn-solid" id="composer-save">저장</button>' +
            "</div>" +
            "</div>";

          document.getElementById("composer-title").value = data.title || "";
          document.getElementById("composer-tag").value = data.tag || "안내";

          tinymce.init(
            Object.assign({}, TINYMCE_CONF, {
              selector: "#composer-editor",
              setup: function (editor) {
                editor.on("init", function () {
                  editor.setContent(data.content || "");
                });
              },
            })
          );

          document
            .getElementById("composer-cancel")
            .addEventListener("click", function () {
              closeComposer(mode, data);
            });
          document
            .getElementById("composer-save")
            .addEventListener("click", function () {
              saveComposer(mode, data);
            });
        }

        function closeComposer(mode, data) {
          destroyEditor();
          composer.hidden = true;
          if (mode === "edit" && data.id) {
            detailView.hidden = false;
          } else {
            listView.hidden = false;
            if (addSlot) addSlot.hidden = false;
          }
        }

        function saveComposer(mode, data) {
          var title = document.getElementById("composer-title").value.trim();
          var tag =
            document.getElementById("composer-tag").value.trim() || "안내";
          var content = tinymce.get("composer-editor").getContent();
          if (!title) {
            alert("제목을 입력해 주세요.");
            return;
          }
          var saveBtn = document.getElementById("composer-save");
          saveBtn.disabled = true;
          saveBtn.textContent = "저장 중...";

          var query =
            mode === "edit"
              ? sb
                  .from("notices")
                  .update({ title: title, tag: tag, content: content })
                  .eq("id", data.id)
              : sb
                  .from("notices")
                  .insert({ title: title, tag: tag, content: content });

          query.then(function (res) {
            if (res.error) {
              alert("저장 실패: " + res.error.message);
              saveBtn.disabled = false;
              saveBtn.textContent = "저장";
              return;
            }
            destroyEditor();
            composer.hidden = true;
            if (mode === "edit") {
              detailView.hidden = false;
              loadDetail(data.id);
            } else {
              listView.hidden = false;
              if (addSlot) addSlot.hidden = false;
              loadList();
            }
          });
        }

        // ---------- list ----------
        function loadList() {
          sb.from("notices")
            .select("id, tag, title, created_at")
            .eq("published", true)
            .order("created_at", { ascending: false })
            .then(function (res) {
              fullList.innerHTML = "";
              if (res.error) return;
              var rows = res.data || [];
              if (!rows.length) {
                var empty = document.createElement("li");
                empty.className = "notice-empty";
                empty.textContent = "등록된 공지사항이 없습니다.";
                fullList.appendChild(empty);
                return;
              }
              rows.forEach(renderListItem);
            });
        }

        function renderListItem(row) {
          var li = document.createElement("li");
          li.className = "notice-row-item";
          var main = document.createElement("div");
          main.className = "notice-row-main";

          var link = document.createElement("a");
          link.href = "notice.html?id=" + row.id;
          link.className = "notice-row-link";
          var tag = document.createElement("span");
          tag.className = "notice-tag";
          tag.textContent = row.tag;
          var text = document.createElement("span");
          text.className = "notice-text";
          text.textContent = row.title;
          var date = document.createElement("span");
          date.className = "notice-date";
          date.textContent = formatDate(row.created_at);
          link.appendChild(tag);
          link.appendChild(text);
          link.appendChild(date);
          main.appendChild(link);

          if (window.adminMode && window.adminMode.isOn) {
            var actions = document.createElement("div");
            actions.className = "notice-row-actions";
            var editBtn = document.createElement("button");
            editBtn.type = "button";
            editBtn.className = "admin-row-btn";
            editBtn.textContent = "✏️ 수정";
            editBtn.addEventListener("click", function () {
              openComposer("edit", {
                id: row.id,
                title: row.title,
                tag: row.tag,
                content: null,
              });
              // 본문은 수정 화면 열릴 때 따로 불러온다 (목록엔 없음)
              sb.from("notices")
                .select("content")
                .eq("id", row.id)
                .maybeSingle()
                .then(function (r) {
                  if (r.data) {
                    var ed = tinymce.get("composer-editor");
                    if (ed) ed.setContent(r.data.content || "");
                  }
                });
            });
            var delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "admin-row-btn";
            delBtn.textContent = "🗑 삭제";
            delBtn.addEventListener("click", function () {
              if (!confirm("이 공지사항을 삭제할까요?")) return;
              sb.from("notices")
                .delete()
                .eq("id", row.id)
                .then(function (res) {
                  if (res.error) alert("삭제 실패: " + res.error.message);
                  else loadList();
                });
            });
            actions.appendChild(editBtn);
            actions.appendChild(delBtn);
            main.appendChild(actions);
          }

          li.appendChild(main);
          fullList.appendChild(li);
        }

        function renderAddButton() {
          if (!addSlot) return;
          addSlot.hidden = false;
          addSlot.innerHTML = "";
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn btn-solid";
          btn.textContent = "+ 새 공지 작성";
          btn.addEventListener("click", function () {
            openComposer("add", {});
          });
          addSlot.appendChild(btn);
        }

        // ---------- detail ----------
        function loadDetail(id) {
          sb.from("notices")
            .select("id, tag, title, content, created_at")
            .eq("id", id)
            .maybeSingle()
            .then(function (res) {
              var detailContent = document.getElementById("detail-content");
              var detailActions = document.getElementById("detail-actions");
              detailActions.innerHTML = "";
              if (res.error || !res.data) {
                document.getElementById("detail-tag").hidden = true;
                document.getElementById("detail-title").textContent =
                  "해당 공지사항을 찾을 수 없습니다.";
                document.getElementById("detail-meta").hidden = true;
                detailContent.innerHTML = "";
                return;
              }
              var row = res.data;
              document.getElementById("detail-tag").textContent = row.tag;
              document.getElementById("detail-title").textContent =
                row.title;
              document.getElementById("detail-meta").textContent =
                "관리자 · " + formatDate(row.created_at);
              detailContent.innerHTML = row.content || "";

              if (window.adminMode && window.adminMode.isOn) {
                var editBtn = document.createElement("button");
                editBtn.type = "button";
                editBtn.className = "btn btn-ghost";
                editBtn.textContent = "✏️ 수정";
                editBtn.addEventListener("click", function () {
                  openComposer("edit", {
                    id: row.id,
                    title: row.title,
                    tag: row.tag,
                    content: row.content,
                  });
                });
                var delBtn = document.createElement("button");
                delBtn.type = "button";
                delBtn.className = "btn btn-ghost";
                delBtn.textContent = "🗑 삭제";
                delBtn.addEventListener("click", function () {
                  if (!confirm("이 공지사항을 삭제할까요?")) return;
                  sb.from("notices")
                    .delete()
                    .eq("id", row.id)
                    .then(function (res) {
                      if (res.error)
                        alert("삭제 실패: " + res.error.message);
                      else location.href = "notice.html";
                    });
                });
                detailActions.appendChild(editBtn);
                detailActions.appendChild(delBtn);
              }
            });
        }

        // ---------- bootstrap ----------
        if (noticeId) {
          listView.hidden = true;
          pageSub.hidden = true;
          backLink.textContent = "← 공지사항 목록으로";
          backLink.href = "notice.html";
          loadDetail(noticeId);
        } else {
          detailView.hidden = true;
          loadList();
          document.addEventListener("admin-mode:on", function () {
            renderAddButton();
            if (wantsNew) {
              wantsNew = false;
              openComposer("add", {});
            }
          });
          document.addEventListener("admin-mode:off", function () {
            if (addSlot) {
              addSlot.hidden = true;
              addSlot.innerHTML = "";
            }
          });
          if (window.adminMode && window.adminMode.isOn) {
            renderAddButton();
            if (wantsNew) openComposer("add", {});
          }
        }
      })();
    </script>
  </body>
</html>
