<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 화곡 더아름다운한의원</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="logo_512x512_transparent.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --bg-gray: #f6f1f8;
        --surface: #ffffff;
        --ink: #241b2e;
        --ink-soft: #6e6274;
        --border: #e3daea;
        --accent: #4a2168;
        --accent-strong: #2e1440;
        --danger: #b3432f;
        --shadow-soft: 0 18px 40px -24px rgba(46, 20, 64, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg-gray);
        color: var(--ink);
        font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        line-height: 1.6;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 14px clamp(20px, 5vw, 48px);
        display: flex;
        align-items: center;
      }
      .header-home-link {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header img {
        width: 32px;
        height: 32px;
      }
      header strong {
        font-size: 1rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: none;
        border-radius: 999px;
        padding: 10px 20px;
        font-weight: 700;
        font-size: 0.88rem;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-solid {
        background: var(--accent);
        color: #fbf3e4;
        width: 100%;
        margin-top: 8px;
      }
      .btn-solid:hover {
        background: var(--accent-strong);
      }

      #login-view {
        max-width: 360px;
        margin: 80px auto 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 36px;
        box-shadow: var(--shadow-soft);
      }
      #login-view h1 {
        text-align: center;
        font-size: 1.3rem;
        margin: 0;
      }
      #login-view p.sub {
        text-align: center;
        font-size: 0.85rem;
        color: var(--ink-soft);
        margin: 10px 0 24px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }
      .field label {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--ink-soft);
      }
      .field input {
        font-family: inherit;
        font-size: 0.92rem;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
      }
      .error-msg {
        color: var(--danger);
        font-size: 0.82rem;
        margin-top: 12px;
        text-align: center;
      }
      .config-warning {
        max-width: 480px;
        margin: 80px auto 0;
        background: #fff6e5;
        border: 1px solid #e8c77a;
        border-radius: 12px;
        padding: 20px 24px;
        font-size: 0.88rem;
        color: #6b4e00;
      }
      .config-warning code {
        background: rgba(0, 0, 0, 0.06);
        padding: 2px 6px;
        border-radius: 4px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="header-home-link" href="index.html">
        <img src="logo_512x512_transparent.png" alt="로고" />
        <strong>더아름다운한의원</strong>
      </a>
    </header>

    <main>
      <div id="config-missing" class="config-warning" hidden>
        Supabase 설정이 아직 완료되지 않았습니다.
        <code>supabase-config.js</code> 파일에 프로젝트 URL과 anon key를
        입력한 뒤 다시 열어주세요.
      </div>

      <div id="login-view" hidden>
        <h1>로그인</h1>
        <p class="sub">아이디와 비밀번호를 입력해 주세요.</p>
        <form id="login-form">
          <div class="field">
            <label for="login-email">아이디</label>
            <input
              id="login-email"
              type="text"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label for="login-password">비밀번호</label>
            <input
              id="login-password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn btn-solid" type="submit">로그인</button>
          <p class="error-msg" id="login-error" hidden></p>
        </form>
      </div>
    </main>

    <script>
      (function () {
        var configMissing = document.getElementById("config-missing");
        var loginView = document.getElementById("login-view");

        if (!window.supabaseClient) {
          configMissing.hidden = false;
          return;
        }

        var sb = window.supabaseClient;

        function goHome() {
          // 로그인되면 별도 관리자 화면 대신 홈페이지로 이동해서
          // 거기서 바로 인라인으로 콘텐츠를 수정합니다.
          location.href = "index.html";
        }

        sb.auth.getSession().then(function (res) {
          if (res.data.session) goHome();
          else loginView.hidden = false;
        });

        var loginForm = document.getElementById("login-form");
        var loginError = document.getElementById("login-error");
        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          loginError.hidden = true;
          var username = document.getElementById("login-email").value.trim();
          var domain =
            typeof ADMIN_LOGIN_DOMAIN !== "undefined"
              ? ADMIN_LOGIN_DOMAIN
              : "";
          var email =
            username.indexOf("@") === -1 && domain
              ? username + "@" + domain
              : username;
          var password = document.getElementById("login-password").value;
          sb.auth
            .signInWithPassword({ email: email, password: password })
            .then(function (res) {
              if (res.error) {
                loginError.textContent =
                  "로그인에 실패했습니다: " + res.error.message;
                loginError.hidden = false;
              } else {
                goHome();
              }
            });
        });
      })();
    </script>
  </body>
</html>
